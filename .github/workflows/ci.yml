name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    # Required checks (lint, build-test) must be reported on every PR —
    # including docs-only PRs — or the main-protection ruleset can never
    # pass for them. No paths-ignore here.
  schedule:
    - cron: '43 5 * * 1'  # weekly Monday 05:43 UTC — full suite incl. app build

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, macOS, ARM64, macbook-tune]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Select Xcode 27
        run: |
          XCODE=/Applications/Xcode-beta.app
          test -d "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | grep -F 'Xcode 27.0'
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict

  build-test:
    runs-on: [self-hosted, macOS, ARM64, macbook-tune]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Select Xcode 27
        run: |
          XCODE=/Applications/Xcode-beta.app
          test -d "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | grep -F 'Xcode 27.0'
      - name: Cache SwiftPM build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  build-app:
    if: github.event_name != 'pull_request'  # PR gate = lint + SPM build-test; xcodebuild app on main/schedule
    runs-on: [self-hosted, macOS, ARM64, macbook-tune]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Select Xcode 27
        run: |
          XCODE=/Applications/Xcode-beta.app
          test -d "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | grep -F 'Xcode 27.0'
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build app target
        run: ./scripts/build-app.sh
      - name: Smoke-test app bundle
        run: ./scripts/smoke-app.sh build/app/SymairaTune.app
